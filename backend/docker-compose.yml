services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - ${API_PUBLISH:?set API_PUBLISH in backend/.env}
    environment:
      DATABASE_PATH: ${DATABASE_PATH:?set DATABASE_PATH in backend/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in backend/.env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in backend/.env}
      SESSION_HTTPS: ${SESSION_HTTPS:?set SESSION_HTTPS in backend/.env}
      LISTEN_HOST: ${LISTEN_HOST:?set LISTEN_HOST in backend/.env}
      LISTEN_PORT: ${LISTEN_PORT:?set LISTEN_PORT in backend/.env}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS-}
      SSL_CERT_FILE: ${SSL_CERT_FILE-}
      SSL_KEY_FILE: ${SSL_KEY_FILE-}
    volumes:
      - susiturkki-data:/data
      - ${SSL_CERT_FILE:-/dev/null}:${SSL_CERT_FILE:-/certs/cert.pem}:ro
      - ${SSL_KEY_FILE:-/dev/null}:${SSL_KEY_FILE:-/certs/key.pem}:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 256m
    user: "1000:1000"

volumes:
  susiturkki-data:
